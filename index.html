<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNES Thai Patcher</title>
<style>:root{color-scheme:light dark;--bg:#f6f7fb;--fg:#1b1f2a;--card:#fff;--ac:#2a5bd7;--mut:#667}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--fg:#e8eaf0;--card:#1a1f2b;--ac:#6c92ff;--mut:#9aa}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.c{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 10px #0002}
select,button{font:inherit;padding:10px;border-radius:8px;width:100%;margin-top:8px}
#drop{border:2px dashed var(--ac);border-radius:12px;padding:28px;text-align:center;margin-top:14px;cursor:pointer}
#drop.o{background:#2a5bd722}button{background:var(--ac);color:#fff;border:0;cursor:pointer}
#msg{margin-top:12px;min-height:1.5em}.ok{color:#2a9d4a}.er{color:#d33}small{color:var(--mut)}</style></head><body><main>
<h1>แพตช์เกม SNES ภาษาไทย</h1>
<div class="c"><label>เลือกเกม</label><select id="g"></select>
<div id="drop">ลากไฟล์รอม .sfc / .smc มาวางที่นี่<br><small>หรือคลิกเพื่อเลือกไฟล์</small></div>
<input type="file" id="f" accept=".sfc,.smc,.bin" hidden><div id="msg"></div></div>
<p><small>ทำงานในเบราว์เซอร์ของคุณทั้งหมด ไฟล์รอมไม่ถูกอัปโหลดไปไหน เว็บนี้ไม่มีรอมเกมให้ — ต้องใช้รอมที่คุณมีเองเท่านั้น</small></p></main>
<script src="patches/ffmq.js"></script>
<script>
const GAMES={ffmq:{name:"Final Fantasy: Mystic Quest (USA, Rev 1) — แปลบทสนทนา",crc:0,size:524288,out:"FFMQ_Thai.sfc"}};
GAMES.ffmq.crc=743622546;
const $=i=>document.getElementById(i),g=$('g'),msg=$('msg');
for(const k in GAMES)g.add(new Option(GAMES[k].name,k));
function crc32(u){let t=crc32.t;if(!t){t=crc32.t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}}let c=-1;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}
function ips(rom,p){if(String.fromCharCode(...p.slice(0,5))!="PATCH")throw"แพตช์เสีย";let o=5,size=rom.length,recs=[];
while(!(p[o]==69&&p[o+1]==79&&p[o+2]==70)){const a=p[o]<<16|p[o+1]<<8|p[o+2],l=p[o+3]<<8|p[o+4];o+=5;
if(l){recs.push([a,p.subarray(o,o+l)]);o+=l;size=Math.max(size,a+l)}else{const r=p[o]<<8|p[o+1],v=p[o+2];o+=3;recs.push([a,new Uint8Array(r).fill(v)]);size=Math.max(size,a+r)}}
const out=new Uint8Array(size);out.set(rom);for(const[a,d]of recs)out.set(d,a);return out}
function fixsum(r){const n=r.length;let s=0;for(let i=0;i<n;i++)s+=r[i];s&=0xFFFF;const c=s^0xFFFF;r[0x7FDC]=c&255;r[0x7FDD]=c>>8;r[0x7FDE]=s&255;r[0x7FDF]=s>>8}
async function run(file){msg.className='';msg.textContent='กำลังแพตช์...';try{
const G=GAMES[g.value];let rom=new Uint8Array(await file.arrayBuffer());
if(rom.length%1024==512)rom=rom.subarray(512);
if(rom.length!=G.size||crc32(rom)!=G.crc)throw"รอมไม่ตรงกับเกมที่เลือก (ต้องเป็นเวอร์ชัน USA Rev 1 ไม่มีการแก้ไข)";
const p=Uint8Array.from(atob(window.PATCHES[g.value]),c=>c.charCodeAt(0));
const out=ips(rom,p);
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download=G.out;a.click();
msg.className='ok';msg.textContent='สำเร็จ! ดาวน์โหลด '+G.out+' แล้ว'}catch(e){msg.className='er';msg.textContent=''+e}}
$('drop').onclick=()=>$('f').click();$('f').onchange=e=>e.target.files[0]&&run(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('o')};$('drop').ondragleave=()=>$('drop').classList.remove('o');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('o');e.dataTransfer.files[0]&&run(e.dataTransfer.files[0])};
</script></body></html>
