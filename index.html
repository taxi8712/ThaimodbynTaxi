<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNES 繁體中文網頁補丁工具</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb;
    --fg: #1b1f2a;
    --card: #fff;
    --ac: #2a5bd7;
    --mut: #667;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .c {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 10px #0002;
  }
  select, button {
    font: inherit;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    margin-top: 8px;
  }
  #drop {
    border: 2px dashed var(--ac);
    border-radius: 12px;
    padding: 28px;
    text-align: center;
    margin-top: 14px;
    cursor: pointer;
  }
  #drop.highlight {
    background: #2a5bd722;
  }
  button {
    background: var(--ac);
    color: #fff;
    border: 0;
    cursor: pointer;
  }
  #msg {
    margin-top: 12px;
    min-height: 1.5em;
  }
  .ok { color: #2a9d4a; }
  .er { color: #d33; }
  small { color: var(--mut); }
</style>
</head>
<body>
<main>
  <h1>SNES 繁體中文網頁補丁工具</h1>
  <div class="c">
    <label>選擇遊戲</label>
    <select id="g"></select>
    <div id="drop">
      拖曳遊戲檔案到這裡<br>
      <small>或點擊選擇檔案 (支援 .sfc .smc .bin 等格式)</small>
    </div>
    <input type="file" id="f" hidden>
    <div id="msg"></div>
  </div>
  <p>
    <small>
      1. 本工具完全在瀏覽器端運行，不會上傳您的檔案。<br>
      2. 本站不提供任何遊戲檔案。
    </small>
  </p>
</main>

<script src="patches/ffmq.js"></script>
<script src="patches/ys3.js"></script>
<script>
const GAMES = {
  ffmq: {
    name: "Final Fantasy:  — 繁體中文",
    crc: 743622546,
    size: 524288,
    out: "FFMQ_BS.sfc"
  },
  ys3: {
    name: "Option 2：Ys III:  — 繁體中文",
    crc: 0x64a91e64,
    size: 1048576,
    out: "SMC_BS.sfc"
  }
};

const $ = i => document.getElementById(i);
const g = $('g');
const msg = $('msg');

// 載入下拉選單選項
for (const k in GAMES) {
  g.add(new Option(GAMES[k].name, k));
}

function crc32(u) {
  let t = crc32.t;
  if (!t) {
    t = crc32.t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c;
    }
  }
  let c = -1;
  for (let i = 0; i < u.length; i++) c = t[(c ^ u[i]) & 255] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}

function ips(rom, p) {
  if (String.fromCharCode(...p.slice(0, 5)) != "PATCH") throw "補丁檔案損毀";
  let o = 5, size = rom.length, recs = [];
  while (!(p[o] == 69 && p[o + 1] == 70 && p[o + 2] == 70)) { // "EOF"
    const a = p[o] << 16 | p[o + 1] << 8 | p[o + 2], l = p[o + 3] << 8 | p[o + 4];
    o += 5;
    if (l) {
      recs.push([a, p.subarray(o, o + l)]);
      o += l;
      size = Math.max(size, a + l);
    } else {
      const r = p[o] << 8 | p[o + 1], v = p[o + 2];
      o += 3;
      recs.push([a, new Uint8Array(r).fill(v)]);
    }
  }
  const out = new Uint8Array(size);
  out.set(rom);
  for (const [a, d] of recs) out.set(d, a);
  return out;
}

async function run(file) {
  msg.className = '';
  msg.textContent = '處理中...';
  try {
    let arrayBuffer = await file.arrayBuffer();
    let formBuf = new Uint8Array(arrayBuffer);
    
    // 去除 SMC 標頭檔 (512 bytes)
    if (formBuf.length % 1024 === 512) {
      formBuf = formBuf.subarray(512);
    }

    const cr = crc32(formBuf);
    for (const k in GAMES) {
      if (GAMES[k].crc === cr && GAMES[k].size === formBuf.length) {
        g.value = k;
      }
    }
    
    const G = GAMES[g.value];
    if (formBuf.length !== G.size || cr !== G.crc) {
      throw "選擇的檔案不匹配或檔案已毀損";
    }

    const p =空間 => {
      // 依據選取的邏輯加載 patch 資料
      let patchBase64 = window.PATCHES ? window.PATCHES[g.value] : null;
      if(!patchBase64 && typeof {ffmq:0, ys3:0}[g.value] !== 'undefined') {
         // 相容性處理，若變數存在直接抓取
         patchBase64 = window[g.value + "_patch"];
      }
      return Uint8Array.from(atob(patchBase64), c => c.charCodeAt(0));
    };

    const out = ips(formBuf, p());

    // 動態判斷檔名導出
    const rawName = file.name.replace(/\.[^/.]+$/, "");
    const outFileName = `${rawName}_BS.sfc`;

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out]));
    a.download = outFileName;
    a.click();

    msg.className = 'ok';
    msg.textContent = `成功！已下載 ${outFileName}`;
  } catch (e) {
    msg.className = 'er';
    msg.textContent = e;
  }
}

// 綁定 DOM 事件
$('drop').onclick = () => $('f').click();$('f').onchange = e => e.target.files[0] && run(e.target.files[0]);

// Drag & Drop 事件處理 (使用 'highlight' 類別)
$('drop').ondragover = e => {
  e.preventDefault();
  $('drop').classList.add('highlight');
};

$('drop').ondragleave = () => {$('drop').classList.remove('highlight');
};

$('drop').ondrop = e => {
  e.preventDefault();
  $('drop').classList.remove('highlight');
  if (e.dataTransfer.files.length > 0) {
    run(e.dataTransfer.files[0]);
  }
};
</script>
</body>
</html>
